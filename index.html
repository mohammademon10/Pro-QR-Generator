<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PRO QR Generator – Advanced QR Code Generator with AI design, analytics, and export options.">
    <meta name="keywords" content="QR code generator, Pro QR, AI QR, QR analytics">
    <meta name="robots" content="index, follow">

    <title>PRO QR - Engineering Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Scanner Animation */
        @keyframes scanner {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-scanner {
            animation: scanner 3s linear infinite;
        }

        /* Designer Matrix Background */
        .matrix-bg {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
            mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 70%, transparent 100%);
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Ensure QR container is stable */
        #qrcode {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            width: 280px;
        }
        #qrcode img, #qrcode canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-white min-h-screen relative overflow-x-hidden selection:bg-blue-100 selection:text-blue-900">

    <!-- Background Layer -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute inset-0 matrix-bg opacity-40"></div>
        <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-blue-50/50 to-transparent"></div>
    </div>

    <div class="relative max-w-7xl mx-auto px-6 py-10 md:py-16">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-end md:items-center mb-16 gap-8">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="absolute inset-0 bg-blue-600 blur-xl opacity-20 animate-pulse"></div>
                    <div class="relative bg-slate-900 p-4 rounded-3xl shadow-2xl rotate-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="text-blue-400">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h1 class="text-4xl font-black tracking-tighter text-slate-900 flex items-center">
                        PRO<span class="text-blue-600">QR</span>
                        <span class="ml-3 text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full border border-slate-200 uppercase tracking-widest">v2.6</span>
                    </h1>
                    <p class="text-slate-500 text-sm font-bold mt-1">Professional QR Engineering Studio</p>
                </div>
            </div>
            
            <button id="toggleHistory" class="group flex items-center gap-3 px-8 py-4 rounded-[22px] transition-all font-black text-xs uppercase tracking-widest border-2 bg-white text-slate-900 border-slate-100 hover:border-slate-200 hover:shadow-xl hover:translate-y-[-1px]">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                <span id="historyText">View Library</span>
            </button>
        </header>

        <!-- Main Workspace -->
        <div id="editorView" class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            
            <div class="lg:col-span-7 space-y-10">
                <!-- Type Switcher -->
                <nav id="typeSwitcher" class="bg-slate-100/50 backdrop-blur-md p-2 rounded-[36px] border border-slate-200/50 flex flex-wrap gap-2 shadow-inner">
                    <button data-type="URL" class="type-btn active-tab flex-1 flex items-center justify-center gap-3 px-4 py-5 rounded-[28px] transition-all font-black text-[10px] uppercase tracking-[0.2em] bg-white text-slate-900 shadow-md ring-1 ring-slate-200">URL</button>
                    <button data-type="vCard" class="type-btn flex-1 flex items-center justify-center gap-3 px-4 py-5 rounded-[28px] transition-all font-black text-[10px] uppercase tracking-[0.2em] text-slate-400 hover:text-slate-600">VCARD</button>
                    <button data-type="WiFi" class="type-btn flex-1 flex items-center justify-center gap-3 px-4 py-5 rounded-[28px] transition-all font-black text-[10px] uppercase tracking-[0.2em] text-slate-400 hover:text-slate-600">WIFI</button>
                    <button data-type="Text" class="type-btn flex-1 flex items-center justify-center gap-3 px-4 py-5 rounded-[28px] transition-all font-black text-[10px] uppercase tracking-[0.2em] text-slate-400 hover:text-slate-600">TEXT</button>
                </nav>

                <!-- Dynamic Form -->
                <div class="bg-white rounded-[48px] p-10 md:p-14 shadow-2xl border border-slate-100">
                    <div id="formContainer" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
                        <!-- Content Injected via JS -->
                    </div>
                </div>

                <!-- Appearance -->
                <div class="bg-white rounded-[48px] p-10 md:p-14 shadow-xl border border-slate-100">
                    <h3 class="text-2xl font-black mb-10 tracking-tight">Style Identity</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                        <div class="space-y-4">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Foreground</label>
                            <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <input type="color" id="fgColor" value="#0f172a" class="w-14 h-14 rounded-xl cursor-pointer bg-transparent border-none">
                                <span id="fgLabel" class="text-xs font-black uppercase">#0F172A</span>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Background</label>
                            <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <input type="color" id="bgColor" value="#ffffff" class="w-14 h-14 rounded-xl cursor-pointer bg-transparent border-none">
                                <span id="bgLabel" class="text-xs font-black uppercase">#FFFFFF</span>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Branding</label>
                            <label class="flex flex-col items-center justify-center h-20 border-2 border-dashed border-slate-200 rounded-[28px] p-4 cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 transition-all bg-slate-50/30">
                                <div id="logoPreview" class="flex items-center gap-2 text-slate-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    <span class="text-[9px] font-black uppercase tracking-widest">Add Icon</span>
                                </div>
                                <input type="file" id="logoUpload" class="hidden" accept="image/*">
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview Sidebar -->
            <div class="lg:col-span-5 lg:sticky lg:top-10">
                <div class="bg-slate-900 rounded-[56px] p-10 md:p-14 shadow-2xl text-white relative overflow-hidden flex flex-col items-center">
                    <div class="absolute top-10 left-10 w-10 h-10 border-t-4 border-l-4 border-slate-700/50 rounded-tl-xl"></div>
                    <div class="absolute top-10 right-10 w-10 h-10 border-t-4 border-r-4 border-slate-700/50 rounded-tr-xl"></div>
                    
                    <div class="w-full flex justify-between items-center mb-12">
                        <div class="flex items-center gap-3">
                            <div class="w-2.5 h-2.5 bg-blue-500 rounded-full animate-pulse"></div>
                            <h3 class="text-xs font-black uppercase tracking-[0.4em] text-slate-400">Live Render</h3>
                        </div>
                    </div>

                    <div id="qrWrapper" class="relative p-8 rounded-[40px] shadow-2xl bg-white overflow-hidden transition-all duration-300">
                        <div class="absolute left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500/40 to-transparent top-0 animate-scanner z-10 pointer-events-none"></div>
                        <div id="qrcode" class="relative z-0"></div>
                    </div>

                    <div class="w-full mt-16 space-y-4">
                        <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-6 rounded-[32px] flex items-center justify-center gap-4 shadow-2xl transition-all active:scale-95 text-xs uppercase tracking-[0.2em]">
                            Export Final Node
                        </button>
                        <div class="flex gap-4">
                            <button id="copyBtn" class="flex-1 flex items-center justify-center gap-3 p-5 bg-slate-800 rounded-[28px] text-slate-400 hover:text-white transition-all text-[10px] font-black uppercase tracking-widest">
                                Copy Data
                            </button>
                            <button id="resetBtn" class="p-5 bg-slate-800 rounded-[28px] text-slate-400 hover:text-white transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Library View -->
        <div id="libraryView" class="hidden bg-white rounded-[48px] p-10 md:p-14 shadow-2xl border border-slate-100 min-h-[500px]">
            <h2 class="text-3xl font-black mb-12 flex items-center gap-4">
                <div class="w-3 h-10 bg-blue-600 rounded-full"></div>
                Project Library
            </h2>
            <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-10 py-5 rounded-[24px] shadow-2xl transition-all -translate-y-40 opacity-0 z-[100] border border-white/10 flex items-center gap-4">
        <div class="bg-blue-500 rounded-full p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span id="toastMsg" class="text-xs font-black uppercase tracking-widest">Ready</span>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /**
         * LOCAL SETUP: If running in VS Code, manually populate this object.
         * The __firebase_config variable is provided by the Canvas platform.
         */
        const localConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : (localConfig.apiKey ? localConfig : null);

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'qr-pro-app';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Init Services - Guard against missing config locally
        let db, auth;
        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        // App State
        let currentUser = null;
        let activeType = 'URL';
        let logoData = null;
        let qrTimeout = null;

        // Elements
        const formContainer = document.getElementById('formContainer');
        const qrContainer = document.getElementById('qrcode');
        const qrWrapper = document.getElementById('qrWrapper');
        const historyGrid = document.getElementById('historyGrid');
        const editorView = document.getElementById('editorView');
        const libraryView = document.getElementById('libraryView');

        /**
         * Auth Before Queries
         */
        async function initAuth() {
            if (!auth) return;
            try {
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Failed", err);
            }
        }

        if (auth) {
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user && db) {
                    const q = query(collection(db, 'artifacts', appId, 'users', user.uid, 'history'));
                    onSnapshot(q, 
                        (snapshot) => {
                            const history = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            renderHistory(history.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                        },
                        (error) => { console.error("History stream error:", error); }
                    );
                }
            });
        }

        // UI Generation
        const renderForm = () => {
            formContainer.innerHTML = '';
            const fields = {
                'URL': [ { label: 'Target URL', id: 'url-input', placeholder: 'https://brand.com', col: 'col-span-2' } ],
                'vCard': [
                    { label: 'Name', id: 'v-name', placeholder: 'John Doe' },
                    { label: 'Email', id: 'v-email', placeholder: 'john@doe.com' },
                    { label: 'Phone', id: 'v-phone', placeholder: '+1 234...' },
                    { label: 'Company', id: 'v-org', placeholder: 'Acme Corp' }
                ],
                'WiFi': [
                    { label: 'SSID', id: 'w-ssid', placeholder: 'Home_Network' },
                    { label: 'Password', id: 'w-pass', placeholder: '••••', type: 'password' },
                    { label: 'Security', id: 'w-type', isSelect: true, options: ['WPA', 'WEP', 'nopass'] }
                ],
                'Text': [ { label: 'Raw Data', id: 'text-input', placeholder: 'Enter content...', col: 'col-span-2' } ]
            };

            const activeFields = fields[activeType];
            activeFields.forEach(f => {
                if (f.isSelect) {
                    formContainer.innerHTML += `
                        <div class="flex flex-col gap-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${f.label}</label>
                            <select id="${f.id}" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold outline-none text-sm appearance-none cursor-pointer">
                                ${f.options.map(opt => `<option value="${opt}">${opt === 'nopass' ? 'Open' : opt}</option>`).join('')}
                            </select>
                        </div>`;
                } else {
                    formContainer.innerHTML += `
                        <div class="flex flex-col gap-2 ${f.col || ''}">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${f.label}</label>
                            <input type="${f.type || 'text'}" id="${f.id}" placeholder="${f.placeholder}" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-600/5 focus:border-blue-600 outline-none transition-all font-semibold text-sm">
                        </div>`;
                }
            });

            formContainer.querySelectorAll('input, select').forEach(el => el.addEventListener('input', () => {
                clearTimeout(qrTimeout);
                qrTimeout = setTimeout(generateQR, 200);
            }));
        };

        const getQRString = () => {
            try {
                if (activeType === 'URL') return document.getElementById('url-input')?.value || '';
                if (activeType === 'Text') return document.getElementById('text-input')?.value || '';
                if (activeType === 'WiFi') {
                    const s = document.getElementById('w-ssid')?.value || '';
                    const p = document.getElementById('w-pass')?.value || '';
                    const t = document.getElementById('w-type')?.value || 'WPA';
                    return s ? `WIFI:S:${s};T:${t};P:${p};;` : '';
                }
                if (activeType === 'vCard') {
                    const n = document.getElementById('v-name')?.value || '';
                    const e = document.getElementById('v-email')?.value || '';
                    const p = document.getElementById('v-phone')?.value || '';
                    const o = document.getElementById('v-org')?.value || '';
                    return n ? `BEGIN:VCARD\nVERSION:3.0\nN:${n}\nORG:${o}\nTEL:${p}\nEMAIL:${e}\nEND:VCARD` : '';
                }
            } catch (e) { return ''; }
            return '';
        };

        const generateQR = () => {
            const str = getQRString();
            const fg = document.getElementById('fgColor').value;
            const bg = document.getElementById('bgColor').value;
            
            qrWrapper.style.backgroundColor = bg;
            qrContainer.innerHTML = '';
            
            if (!str) return;

            new QRCode(qrContainer, {
                text: str,
                width: 280,
                height: 280,
                colorDark: fg,
                colorLight: bg,
                correctLevel: logoData ? QRCode.CorrectLevel.H : QRCode.CorrectLevel.M
            });

            if (logoData) {
                setTimeout(() => {
                    const canvas = qrContainer.querySelector('canvas');
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        const size = 280;
                        const lSize = size * 0.22;
                        const pos = (size - lSize) / 2;
                        
                        ctx.fillStyle = bg;
                        ctx.beginPath();
                        ctx.arc(size/2, size/2, (lSize/2) + 8, 0, Math.PI * 2);
                        ctx.fill();

                        const logoImg = new Image();
                        logoImg.onload = () => ctx.drawImage(logoImg, pos, pos, lSize, lSize);
                        logoImg.src = logoData;
                    }
                }, 150);
            }
        };

        const downloadQR = () => {
            const canvas = qrContainer.querySelector('canvas');
            const img = qrContainer.querySelector('img');
            
            let dataUrl = '';
            if (canvas) dataUrl = canvas.toDataURL('image/png');
            else if (img && img.src) dataUrl = img.src;

            if (!dataUrl || dataUrl.length < 100) {
                showToast("Please enter some data first");
                return;
            }

            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `PRO-QR-${activeType}-${Date.now()}.png`;
            link.click();
            
            saveHistory();
            showToast("Export Successful");
        };

        const saveHistory = async () => {
            if (!currentUser || !db) return;
            const content = getQRString();
            if (!content) return;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'history'), {
                    type: activeType,
                    content,
                    createdAt: serverTimestamp()
                });
            } catch (e) { console.error("Save error:", e); }
        };

        const renderHistory = (items) => {
            historyGrid.innerHTML = items.length ? '' : '<div class="col-span-4 text-center py-20 text-slate-300 font-bold">Library Empty</div>';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-slate-50 p-6 rounded-[32px] border border-slate-100 flex flex-col justify-between hover:bg-white hover:shadow-xl transition-all group';
                div.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[9px] font-black bg-white text-blue-600 border border-blue-100 px-3 py-1.5 rounded-full uppercase">${item.type}</span>
                            <button class="delete-item text-slate-300 hover:text-red-500 transition-colors" data-id="${item.id}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            </button>
                        </div>
                        <p class="text-sm font-bold text-slate-700 break-all line-clamp-3">${item.content}</p>
                    </div>`;
                div.querySelector('.delete-item').onclick = () => {
                    if (db && currentUser) deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'history', item.id));
                };
                historyGrid.appendChild(div);
            });
        };

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('-translate-y-40', 'opacity-0');
            setTimeout(() => t.classList.add('-translate-y-40', 'opacity-0'), 2500);
        };

        // UI Listeners
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.type-btn').forEach(b => {
                    b.classList.remove('bg-white', 'text-slate-900', 'shadow-md', 'ring-1', 'ring-slate-200');
                    b.classList.add('text-slate-400');
                });
                btn.classList.remove('text-slate-400');
                btn.classList.add('bg-white', 'text-slate-900', 'shadow-md', 'ring-1', 'ring-slate-200');
                activeType = btn.dataset.type;
                renderForm();
                generateQR();
            };
        });

        document.getElementById('logoUpload').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                logoData = ev.target.result;
                document.getElementById('logoPreview').innerHTML = `<img src="${logoData}" class="w-8 h-8 rounded-lg object-contain shadow-sm">`;
                generateQR();
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('toggleHistory').onclick = () => {
            const isLib = editorView.classList.contains('hidden');
            editorView.classList.toggle('hidden', !isLib);
            libraryView.classList.toggle('hidden', isLib);
            document.getElementById('historyText').innerText = isLib ? 'View Library' : 'Back to Editor';
        };

        document.getElementById('fgColor').oninput = (e) => {
            document.getElementById('fgLabel').innerText = e.target.value.toUpperCase();
            generateQR();
        };

        document.getElementById('bgColor').oninput = (e) => {
            document.getElementById('bgLabel').innerText = e.target.value.toUpperCase();
            generateQR();
        };

        document.getElementById('downloadBtn').onclick = downloadQR;

        document.getElementById('copyBtn').onclick = () => {
            const str = getQRString();
            if (!str) return;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(str).then(() => showToast("Copied to Clipboard"));
            } else {
                const el = document.createElement('textarea');
                el.value = str;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showToast("Copied to Clipboard");
            }
        };

        document.getElementById('resetBtn').onclick = () => {
            logoData = null;
            document.getElementById('logoPreview').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span class="text-[9px] font-black uppercase tracking-widest">Add Icon</span>`;
            document.getElementById('fgColor').value = '#0f172a';
            document.getElementById('bgColor').value = '#ffffff';
            renderForm();
            generateQR();
            showToast("Identity Reset");
        };

        window.onload = () => {
            initAuth();
            renderForm();
            generateQR();
            if (!firebaseConfig) {
                console.warn("Firebase not initialized. Library and storage features will be disabled. To enable locally, fill in the localConfig object in the script.");
            }
        };
    </script>
</body>

</html>
